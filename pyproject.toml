[build-system]
# Cap <1.32: hatchling 1.32 emits Metadata-Version 2.5, which the twine bundled in the pinned
# PyPI-publish action rejects (pypa/twine#1327). 2.4 is accepted by PyPI and that twine; the
# 1.27 floor is PEP 639 (the SPDX license expression and license-files). Lift once twine updates.
requires      = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name            = "credbox"
version         = "0.2.0"
description     = "A leak-safe secret store for Python apps and CLIs: XDG paths by default or OS-native locations, a masking Secret type, atomic-0600 writes, and opt-in keyring/encrypted backends."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords        = ["credentials", "secrets", "keyring", "xdg", "config", "paths", "security"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies    = []

[project.urls]
Homepage   = "https://github.com/seokhoonj/credbox"
Repository = "https://github.com/seokhoonj/credbox"
Issues     = "https://github.com/seokhoonj/credbox/issues"

[project.optional-dependencies]
keyring = ["keyring>=24"]
crypto  = ["cryptography>=44"]
all     = ["keyring>=24", "cryptography>=44"]

[project.scripts]
credbox                = "credbox.cli:main"
git-credential-credbox = "credbox.git_credential:main"

# Development tooling is a PEP 735 dependency group, not a published extra: it stays out of the
# distribution metadata (no `Provides-Extra: dev`), so the user-facing extras are only keyring /
# crypto / all. Install it for local work or CI with `uv pip install -e . --group dev` (or
# `pip install -e . --group dev`). The keyring + cryptography here let the full suite exercise both
# optional backends.
[dependency-groups]
dev = [
    "keyring>=24",
    "cryptography>=44",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/credbox"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

# keyring is an optional dependency and ships no type stubs; the backend that uses it
# guards every import, so type-checking without it installed must not error here.
[[tool.mypy.overrides]]
module = ["keyring", "keyring.errors"]
ignore_missing_imports = true

# cryptography ships type information, but its Argon2id KDF lives in a hazmat submodule that
# some stub versions do not fully cover; the encrypted backend guards its import behind the
# find-spec factory, so type-checking without it installed must not error here.
[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

# This module carries a POSIX branch and a Windows branch, and typeshed only reveals
# the host's own (fcntl vs msvcrt). Both branches need an ignore and one is always
# unused, so type-checking on either OS means not warning here.
[[tool.mypy.overrides]]
module = ["credbox._oslock"]
warn_unused_ignores = false
